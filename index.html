<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keystone Tri-Portal V3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #0B5F6B; text-decoration: none; }
    a:hover { color: #08434C; }
    button:focus { outline: 2px solid #F2B66D; outline-offset: 2px; }
  </style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; background: #F4F5F2; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #15222B; display: flex; flex-direction: column;">

  <!-- ================= TOP PERSONA SWITCHER ================= -->
  <header style="background: #09191E; color: #E7ECEE; padding: 10px 24px; border-bottom: 2px solid #F2B66D; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100;">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="font-weight: 800; font-size: 19px; letter-spacing: 0.04em; color: #FFFFFF">KEYSTONE</div>
      <div style="font-size: 11px; color: #A6C1C4; background: #173238; padding: 3px 8px; border-radius: 4px; font-weight: 600">THREE STAKEHOLDER VIEWS · ONE SHARED RECORD</div>
    </div>
    <div style="font-size: 12px; color: #F2B66D; font-weight: 600">Simulated data &middot; nothing here is connected to real banks, borrowers or accounts</div>
    <nav style="display: flex; align-items: center; gap: 8px">
      <button type="button" onClick="{{switchBank}}" style="min-height: 34px; padding: 0 14px; border-radius: 6px; border: 0; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; {{personaBtnBank}}">
        Bank Monitoring
      </button>
      <button type="button" onClick="{{switchEcap}}" style="min-height: 34px; padding: 0 14px; border-radius: 6px; border: 0; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; {{personaBtnEcap}}">
        eCapital Console
      </button>
      <button type="button" onClick="{{switchBorrower}}" style="min-height: 34px; padding: 0 14px; border-radius: 6px; border: 0; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; {{personaBtnBorrower}}">
        Borrower Hub
      </button>
    </nav>
  </header>

  <!-- ================= MAIN LAYOUT WITH DYNAMIC CLICKABLE SIDEBAR ================= -->
  <div style="flex: 1; display: flex; flex-wrap: wrap">

    <!-- SIDEBAR -->
    <nav aria-label="Portal Navigation" style="flex: 1 1 230px; max-width: 260px; background: {{theme.navBg}}; color: #E7ECEE; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
      <div style="font-weight: 700; font-size: 16px; padding: 0 8px 2px">{{sidebar.title}}</div>
      <div style="font-size: 12px; color: {{theme.subColor}}; padding: 0 8px 18px; border-bottom: 1px solid rgba(255,255,255,0.1)">{{sidebar.sub}}</div>
      
      <template data-sc="for" list="{{sidebar.links}}" as="link">
        <button type="button" onClick="{{link.onClick}}" style="width: 100%; text-align: left; padding: 10px 12px; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 600; border: 0; cursor: pointer; {{link.style}}">
          {{link.label}}
        </button>
      </template>

      <div style="margin-top: auto; padding: 12px; font-size: 11px; line-height: 1.5; color: {{theme.subColor}}; background: rgba(0,0,0,0.18); border-radius: 6px">
        <b>Prototype:</b> simulated data; no live integrations, consent service or money movement. Each view shows what that party would see.
      </div>
    </nav>

    <!-- CONTENT SURFACE -->
    <main style="flex: 999 1 600px; min-width: 0; padding: 28px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

      <!-- ================= 13-WEEK SIMULATOR CONTROLS ================= -->
      <section aria-label="Simulation controls" style="background: {{theme.navBg}}; color: #FFFFFF; border-radius: 10px; padding: 12px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
        <button type="button" onClick="{{onPlay}}" style="min-height: 38px; min-width: 100px; padding: 0 16px; border-radius: 6px; border: 0; background: #F2B66D; color: #15222B; font: inherit; font-weight: 700; cursor: pointer">{{playLabel}}</button>
        <button type="button" onClick="{{onReset}}" style="min-height: 38px; padding: 0 14px; border-radius: 6px; border: 1px solid #6E8590; background: transparent; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">Reset</button>
        <button type="button" onClick="{{onJump}}" style="min-height: 38px; padding: 0 14px; border-radius: 6px; border: 1px solid #F2B66D; background: transparent; color: #F2B66D; font: inherit; font-weight: 700; cursor: pointer">Jump to the crisis</button>
        <span style="font-size: 13px; color: #C9D5DA">13-week simulation:</span>
        <input id="week" type="range" min="0" max="12" step="1" value="{{week}}" onChange="{{onSlide}}" style="flex: 1 1 200px; min-width: 150px; accent-color: #F2B66D; cursor: pointer">
        <div style="display: flex; flex-direction: column; gap: 1px; min-width: 140px">
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">{{weekLabel}}</div>
          <div style="font-size: 11px; color: #F2B66D">{{weekCount}}</div>
        </div>
      </section>

      <!-- ========================================================================= -->
      <!-- ====================== PERSONA 1: BANK MONITORING ======================= -->
      <!-- ========================================================================= -->
      <template data-sc="if" value="{{isBank}}">

        <!-- SUB-TAB 1: PORTFOLIO HEALTH -->
        <template data-sc="if" value="{{isBankHealth}}">
          <header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
            <div>
              <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #4C5D66">SBA 7(a) BORROWER HEALTH · PHASE 1</div>
              <h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 700">{{viewBank}}: borrower health</h1>
              <div style="font-size: 14px; color: #4C5D66">{{startHint}}</div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
              <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
                <span style="font-size: 12px; color: #4C5D66">Signed in as:</span>
                <button type="button" onClick="{{pickFV}}" style="min-height: 32px; padding: 0 12px; border-radius: 6px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; {{tabFV}}">First Valley Community Bank</button>
                <button type="button" onClick="{{pickLS}}" style="min-height: 32px; padding: 0 12px; border-radius: 6px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; {{tabLS}}">Lakeshore Bank</button>
              </div>
              <div style="font-size: 12px; color: #0E4F45; background: #E8F4F1; padding: 6px 10px; border-radius: 6px">&#128274; You see only the {{bankScope}} your bank referred. Other banks&rsquo; borrowers are never shown; only eCapital&rsquo;s internal console sees all partner banks.</div>
            </div>
          </header>

          <section style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
            <div style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 14px 18px">
              <div style="font-size: 13px; color: #4C5D66">Healthy Credits</div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 700; color: #0E4F45">{{countGreen}}</div>
              <div style="font-size: 11px; color: #4C5D66">Every indicator normal</div>
            </div>
            <div style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 14px 18px">
              <div style="font-size: 13px; color: #4C5D66">Watch List</div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 700; color: #7A3E06">{{countAmber}}</div>
              <div style="font-size: 11px; color: #4C5D66">Dilution or AP drifting</div>
            </div>
            <div style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 14px 18px">
              <div style="font-size: 13px; color: #4C5D66">Action Required (Review)</div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 700; color: #8A1C1C">{{countRed}}</div>
              <div style="font-size: 11px; color: #4C5D66">Needs action now</div>
            </div>
            <div style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 14px 18px">
              <div style="font-size: 13px; color: #4C5D66">Keystone Lines Drawn</div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 700">{{totalDrawn}}</div>
              <div style="font-size: 11px; color: #4C5D66">Across your bank&rsquo;s borrowers</div>
            </div>
          </section>

          <section style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; overflow-x: auto">
            <div style="min-width: 1240px; font-size: 13px">
              <div style="display: grid; grid-template-columns: 220px 95px repeat(9, minmax(0, 1fr)); background: #EEF2F2; font-weight: 600">
                <div style="padding: 12px 14px">Borrower</div>
                <div style="padding: 12px 8px">Status</div>
                <div style="padding: 12px 8px">Debt Cov. (DSCR)</div>
                <div style="padding: 12px 8px">Cash Runway</div>
                <div style="padding: 12px 8px">Revenue YoY</div>
                <div style="padding: 12px 8px">AP &gt; 60 Days</div>
                <div style="padding: 12px 8px">New Debt</div>
                <div style="padding: 12px 8px">A/R Current</div>
                <div style="padding: 12px 8px">Top Payer</div>
                <div style="padding: 12px 8px">Line Drawn</div>
                <div style="padding: 12px 8px">Books Sync</div>
              </div>
              <template data-sc="for" list="{{bankRows}}" as="row">
                <div style="display: grid; grid-template-columns: 220px 95px repeat(9, minmax(0, 1fr)); border-top: 1px solid #E6EAEB; background: {{row.rowBg}}">
                  <div style="padding: 10px 14px; display: flex; flex-direction: column; gap: 3px">
                    <button type="button" onClick="{{row.pick}}" style="padding: 0; border: 0; background: transparent; text-align: left; font: inherit; font-size: 14px; font-weight: 600; color: #0B5F6B; text-decoration: underline; cursor: pointer">{{row.name}}</button>
                    <div style="font-size: 11px; color: #4C5D66">{{row.industry}}</div>
                  </div>
                  <div style="padding: 10px 8px">
                    <span style="display: inline-block; padding: 4px 8px; border-radius: 999px; font-weight: 700; font-size: 11px; {{row.badgeStyle}}">{{row.health}}</span>
                  </div>
                  <template data-sc="for" list="{{row.cells}}" as="cell">
                    <div style="padding: 10px 8px; font-family: 'IBM Plex Mono', monospace; {{cell.style}}">{{cell.text}}</div>
                  </template>
                </div>
              </template>
            </div>
          </section>

          <div style="display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px">
            <section style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
              <div style="display: flex; justify-content: space-between; align-items: center">
                <div>
                  <h2 style="margin: 0; font-size: 18px">{{detail.name}}</h2>
                  <div style="font-size: 13px; color: #4C5D66">{{detail.industry}}</div>
                </div>
                <span style="padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 12px; {{detail.badgeStyle}}">{{detail.health}}</span>
              </div>
              <div style="font-size: 13px; color: #3B4A52; background: #F8FAF9; padding: 8px 12px; border-radius: 6px; border-left: 3px solid #0B5F6B">{{detail.summary}}</div>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
                <template data-sc="for" list="{{detail.items}}" as="it">
                  <div style="border: 1px solid #E1E6E8; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; {{it.boxStyle}}">
                    <div style="font-size: 11px; color: #4C5D66">{{it.label}}</div>
                    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">{{it.text}}</div>
                    <div style="font-size: 10px; color: #4C5D66">{{it.source}}</div>
                  </div>
                </template>
              </div>
            </section>

            <section style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
              <h2 style="margin: 0; font-size: 18px">Bank Risk Alerts</h2>
              <div style="font-size: 12px; color: #4C5D66">Each alert is also emailed to the relationship manager.</div>
              <template data-sc="if" value="{{noEvents}}">
                <div style="font-size: 13px; color: #3B4A52; padding: 8px 0">All indicators stable. Move the timeline slider to simulate 13 weeks.</div>
              </template>
              <template data-sc="for" list="{{events}}" as="ev">
                <div style="display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px solid #EEF1F2">
                  <span style="flex: 0 0 auto; margin-top: 2px; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; {{ev.badgeStyle}}">{{ev.word}}</span>
                  <div style="display: flex; flex-direction: column; gap: 1px">
                    <div style="font-size: 13px"><b>{{ev.name}}</b>: {{ev.text}}</div>
                    <div style="font-size: 11px; color: #4C5D66">{{ev.when}}</div>
                  </div>
                </div>
              </template>
            </section>
          </div>
        </template>

        <!-- SUB-TAB 2: LOAN-FILE REVIEW CONCEPT -->
        <template data-sc="if" value="{{isBankRadar}}">
          <header>
            <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #4C5D66">PHASE 2+ CONCEPT · LOAN-FILE REVIEW</div>
            <h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 700">Loan-file review workspace</h1>
            <div style="font-size: 14px; color: #4C5D66">Surface potential file gaps for bank review while the borrower is still performing</div>
          </header>
          <div style="padding: 12px 14px; border-radius: 8px; background: #FFF7EC; border: 1px solid #E9C9A3; color: #7A3E06; font-size: 13px; line-height: 1.5"><b>Phase 2+ preview, not in the pilot.</b> This view needs bank-system and public-records data that Phase 1 doesn’t use, and its value to banks is tested first by manually reviewing about 100 seasoned loan files in Phase 0.</div>

          <section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
            <div style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 18px">
              <div style="font-size: 13px; color: #4C5D66">Across five sample SBA loans</div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 700; color: #0B5F6B">$6.56M</div>
              <div style="font-size: 12px; color: #4C5D66; margin-top: 4px">75% SBA guarantee assumed on each sample loan</div>
            </div>
            <div style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 18px">
              <div style="font-size: 13px; color: #4C5D66">File gaps flagged / fixed</div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 700; color: {{radarCureColor}}">{{radarDefectCount}} Flagged / 2 Cured</div>
              <div style="font-size: 12px; color: #4C5D66; margin-top: 4px">Value to banks not yet measured</div>
            </div>
            <div style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 18px">
              <div style="font-size: 13px; color: #4C5D66">Value to the bank</div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 700; color: #7A3E06">Not yet measured</div>
              <div style="font-size: 12px; color: #4C5D66; margin-top: 4px">Tested in Phase 0 file review before any paid product</div>
            </div>
          </section>

          <section style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
            <h2 style="margin: 0; font-size: 18px">Loan-file checklist</h2>
            <table style="width: 100%; border-collapse: collapse; font-size: 13px">
              <thead>
                <tr style="background: #EEF2F2; text-align: left">
                  <th style="padding: 10px 12px">Borrower &amp; Industry</th>
                  <th style="padding: 10px 12px">UCC-3 Continuation</th>
                  <th style="padding: 10px 12px">Hazard &amp; Life Ins.</th>
                  <th style="padding: 10px 12px">IRS 4506-C Taxes</th>
                  <th style="padding: 10px 12px">Standby Creditor Note</th>
                  <th style="padding: 10px 12px">Other lenders</th>
                </tr>
              </thead>
              <tbody>
                <template data-sc="for" list="{{radarAuditRows}}" as="r">
                  <tr style="border-top: 1px solid #E6EAEB; background: {{r.bg}}">
                    <td style="padding: 10px 12px; font-weight: 600">{{r.name}}<br><span style="font-size: 11px; color: #4C5D66; font-weight: 400">{{r.industry}}</span></td>
                    <td style="padding: 10px 12px; color: #0E4F45">Expires 2028</td>
                    <td style="padding: 10px 12px; color: #0E4F45">On file</td>
                    <td style="padding: 10px 12px; color: #0E4F45">Matched</td>
                    <td style="padding: 10px 12px; color: #0E4F45">Unchanged</td>
                    <td style="padding: 10px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; {{r.lienStyle}}">{{r.lienText}}</td>
                  </tr>
                </template>
              </tbody>
            </table>
          </section>
        </template>

        <!-- SUB-TAB 3: JOINT WORKOUT ROOM -->
        <template data-sc="if" value="{{isBankWorkout}}">
          <header>
            <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #8A1C1C">EXAMPLE JOINT REVIEW · SUBJECT TO APPLICABLE AGREEMENTS</div>
            <h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 700">Joint Workout Room: Brightwater Imaging Center</h1>
            <div style="font-size: 14px; color: #4C5D66">Opens when a borrower crosses the workout thresholds; every action follows lender policy and the intercreditor agreement</div>
          </header>

          <template data-sc="if" value="{{noWorkout}}">
            <section style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 20px; font-size: 14px; color: #3B4A52">No joint workout is active this week. {{workoutHint}}</section>
          </template>
          <template data-sc="if" value="{{workoutActive}}">
          <section style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px">
            <div style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
              <h2 style="margin: 0; font-size: 18px">Joint workout</h2>
              <div style="padding: 12px; background: #FFF7F6; border: 1px solid #E8B4AE; border-radius: 8px; font-size: 13px; line-height: 1.5; color: #8A1C1C">
                <b>Scenario signals:</b> new daily lender payments appear in week 8, insurance denials push dilution to 5.6%, and debt coverage falls below the 1.25x the SBA loan requires.</div>
              <div style="font-size: 13px; line-height: 1.6; color: #3B4A52">
                <b>Example response options for lender and borrower review:</b>
                <ol style="margin: 6px 0 0; padding-left: 20px">
                  <li><b>Advance rate:</b> review whether a payer-specific rate adjustment is appropriate, with required notice and approval.</li>
                  <li><b>Standstill:</b> lenders could consider a time-limited standstill if negotiated and documented.</li>
                  <li><b>Collateral:</b> reassess eligibility for denied or aged claims using the applicable facility terms.</li>
                  <li><b>Cash:</b> review collection routing and liquidity needs with the borrower and bank; no payment outcome is guaranteed.</li>
                </ol>
              </div>
            </div>

            <div style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
              <h2 style="margin: 0; font-size: 18px">Workout Protocol Timers</h2>
              <div style="border: 1px solid #E1E6E8; border-radius: 6px; padding: 10px; background: #FAFBFA">
                <div style="font-size: 11px; color: #4C5D66">Notice Period to Bank:</div>
                <div style="font-weight: 700; color: #0E4F45">Completed (Day 5 of 5)</div>
              </div>
              <div style="border: 1px solid #E1E6E8; border-radius: 6px; padding: 10px; background: #FAFBFA">
                <div style="font-size: 11px; color: #4C5D66">Joint Borrower Conference:</div>
                <div style="font-weight: 700; color: #0E4F45">Held {{workoutStartLabel}}</div>
              </div>
              <div style="border: 1px solid #E1E6E8; border-radius: 6px; padding: 10px; background: #FAFBFA">
                <div style="font-size: 11px; color: #4C5D66">Re-Underwriting Horizon:</div>
                <div style="font-weight: 700; color: #7A3E06">45 Days Remaining</div>
              </div>
            </div>
          </section>
          </template>
        </template>

        <!-- SUB-TAB 4: SOP 50 57 COMPLIANCE -->
        <template data-sc="if" value="{{isBankSop}}">
          <header>
            <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #4C5D66">PHASE 2+ PREVIEW · SERVICING EVIDENCE</div>
            <h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 700">Servicing evidence log</h1>
            <div style="font-size: 14px; color: #4C5D66">A proposed time-stamped servicing record for bank review; it does not determine compliance or guarantee eligibility</div>
          </header>
          <div style="padding: 12px 14px; border-radius: 8px; background: #FFF7EC; border: 1px solid #E9C9A3; color: #7A3E06; font-size: 13px; line-height: 1.5"><b>Phase 2+ preview, not in the pilot.</b> This view needs bank-system and public-records data that Phase 1 doesn’t use, and its value to banks is tested first by manually reviewing about 100 seasoned loan files in Phase 0.</div>

          <section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
            <div style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 18px">
              <div style="font-size: 13px; color: #4C5D66">Evidence logged</div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 700; color: #0E4F45">Every verification and notice</div>
              <div style="font-size: 12px; color: #4C5D66; margin-top: 4px">Evidence organization only; no compliance determination</div>
            </div>
            <div style="background: #FFFFFF; border: 1px solid #DCE2E4; border-radius: 10px; padding: 18px">
              <div style="font-size: 13px; color: #4C5D66">Lender Service Provider question</div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 700; color: #7A3E06">SBA counsel review</div>
              <div style="font-size: 12px; color: #4C5D66; margin-top: 4px">Open question for Phase 0: whether any file review makes eCapital a service provider</div>
            </div>

(function () {
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var component = null, root = null, tpl = null, pending = false;

  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (patch) {
    var p = typeof patch === 'function' ? patch(this.state) : patch;
    Object.assign(this.state, p);
    schedule();
  };

  function lookup(scope, expr) {
    expr = expr.trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
    var parts = expr.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(scope, str) {
    var whole = str.match(/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/);
    if (whole) return lookup(scope, whole[1]);
    return str.replace(HOLE, function (_, e) { var v = lookup(scope, e); return v == null ? '' : String(v); });
  }
  function renderNodes(nodes, scope, out) { for (var i = 0; i < nodes.length; i++) renderNode(nodes[i], scope, out); }
  function renderNode(n, scope, out) {
    if (n.nodeType === 3) {
      var t = n.nodeValue;
      if (t.indexOf('{{') !== -1) { var v = interp(scope, t); t = v == null ? '' : String(v); }
      out.push(document.createTextNode(t));
      return;
    }
    if (n.nodeType !== 1) return;
    if (n.tagName === 'TEMPLATE' && n.getAttribute('data-sc')) {
      var kind = n.getAttribute('data-sc'), kids = n.content.childNodes;
      if (kind === 'if') { if (interp(scope, n.getAttribute('value') || '')) renderNodes(kids, scope, out); return; }
      var list = interp(scope, n.getAttribute('list') || '') || [], as = n.getAttribute('as') || 'item';
      for (var j = 0; j < list.length; j++) { var child = Object.create(scope); child[as] = list[j]; renderNodes(kids, child, out); }
      return;
    }
    var el = document.createElement(n.tagName.toLowerCase()), valueAttr;
    for (var a = 0; a < n.attributes.length; a++) {
      var name = n.attributes[a].name, val = n.attributes[a].value;
      if (name.indexOf('hint-') === 0) continue;
      if (name.indexOf('on') === 0 && val.indexOf('{{') !== -1) {
        var fn = interp(scope, val);
        if (typeof fn === 'function') el.addEventListener(name.slice(2), fn);
        continue;
      }
      if (name === 'value') { valueAttr = val.indexOf('{{') !== -1 ? interp(scope, val) : val; continue; }
      el.setAttribute(name, val.indexOf('{{') !== -1 ? String(interp(scope, val) == null ? '' : interp(scope, val)) : val);
    }
    var kidsOut = []; renderNodes(n.childNodes, scope, kidsOut);
    for (var k = 0; k < kidsOut.length; k++) el.appendChild(kidsOut[k]);
    if (valueAttr !== undefined) { el.value = valueAttr; if (el.tagName !== 'SELECT') el.setAttribute('value', valueAttr); }
    out.push(el);
  }
  function render() {
    pending = false;
    var out = []; renderNodes(tpl.content.childNodes, component.renderVals(), out);
    root.replaceChildren.apply(root, out);
  }
  function schedule() { if (component && !pending) { pending = true; requestAnimationFrame(render); } }

  window.__startDC = function (Cls) {
    root = document.getElementById('app'); tpl = document.getElementById('tpl');
    component = new Cls({});
    render();
  };
})();

      cell: ['color: #15222B', 'background: #FFF3E3; color: #7A3E06; font-weight: 600', 'background: #FBE1DE; color: #8A1C1C; font-weight: 700'],
      box: ['', 'background: #FFF7EC; border-color: #E9C9A3', 'background: #FDECEA; border-color: #E8B4AE'],
      word: ['Healthy', 'Watch', 'Act now'],
      rowBg: ['#FFFFFF', '#FFFCF7', '#FFF7F6']
    };
  }

  weekLabelFor(w) {
    return 'Scenario week ' + (w + 1);
  }

  renderVals() {
    const s = this.state || {
      persona: 'bank',
      bankSubTab: 'health',
      ecapSubTab: 'collateral',
      borrowerSubTab: 'dash',
      week: 0,
      playing: false,
      selected: 'brightwater',
      selectedBorrower: 'brightwater'
    };
    const week = s.week;
    const persona = s.persona;
    const st = this.styles();
    const bs = this.borrowers();

    let bankCounts = [0, 0, 0];
    let drawnTotal = 0, committed = 0, watchCount = 0, actCount = 0;

    // Bank View Rows
    const viewBank = s.viewBank || 'First Valley Community Bank';
    const bankBs = bs.filter(b => b.bank === viewBank);
    const bankOf = (nm) => { const f = bs.find(b => b.name.split(' ')[0] === nm.split(' ')[0]); return f ? f.bank : null; };
    let bankDrawn = 0;
    bs.forEach(b => { const v0 = b.at(week); drawnTotal += b.limit * v0.line / 100; committed += b.limit; });
    const bankRows = bankBs.map((b) => {
      const v = b.at(week);
      const pct = (x) => (x > 0 ? '+' : x < 0 ? '\u2212' : '') + Math.abs(Math.round(x)) + '%';
      const debtText = v.debt === 0 ? 'None' : v.debt === 1 ? '1 new lender' : 'Daily debits';
      const lineText = Math.round(v.line) + '%' + (v.alert === 2 ? '   workout' : v.alert === 1 ? '   notice' : '');

      const cells = [
        { key: 'cov', text: v.cov.toFixed(2) + 'x', g: this.gradeBank('cov', v) },
        { key: 'cash', text: v.cash.toFixed(1) + ' mo', g: this.gradeBank('cash', v) },
        { key: 'rev', text: pct(v.rev), g: this.gradeBank('rev', v) },
        { key: 'ap', text: Math.round(v.ap) + '%', g: this.gradeBank('ap', v) },
        { key: 'debt', text: debtText, g: this.gradeBank('debt', v) },
        { key: 'ar', text: Math.round(v.arPct) + '%', g: this.gradeBank('ar', v) },
        { key: 'conc', text: Math.round(v.conc) + '%', g: this.gradeBank('conc', v) },
        { key: 'line', text: lineText, g: this.gradeBank('line', v) },
        { key: 'books', text: Math.round(v.books) + 'd ago', g: this.gradeBank('books', v) }
      ];

      const worst = Math.max.apply(null, cells.map(c => c.g));
      bankCounts[worst] += 1;
      bankDrawn += b.limit * v.line / 100;

      return {
        id: b.id,
        name: b.name,
        industry: b.industry,
        health: st.word[worst],
        badgeStyle: st.badge[worst],
        rowBg: st.rowBg[worst],
        cells: cells.map(c => ({ text: c.text, style: st.cell[c.g] })),
        pick: () => this.setState({ selected: b.id })
      };
    });

    // eCapital Rows
    const ecapRows = bs.map((b) => {
      const v = b.at(week);
      const eg = this.gradeEcap(b, v);
      const drawn = b.limit * v.line / 100;
      const base = (v.ar - v.inelig) * v.adv;
      const avail = base - drawn;
      const money = (k) => (k < 0 ? '\u2212$' : '$') + Math.abs(Math.round(k)) + 'K';

      const cells = [
        { key: 'avail', text: money(avail), g: eg.avail },
        { key: 'dil', text: v.dil.toFixed(1) + '%', g: eg.dil },
        { key: 'dso', text: Math.round(v.dso) + 'd', g: eg.dso },
        { key: 'ver', text: Math.round(v.ver) + '%', g: eg.ver },
        { key: 'mis', text: v.mis ? '1 ($14K)' : 'None', g: eg.mis },
        { key: 'conc', text: Math.round(v.conc) + '% ' + v.grade, g: eg.conc },
        { key: 'debt', text: v.lien ? 'Lien alert' : (v.debt === 0 ? 'None' : v.debt === 1 ? '1 lender' : 'Daily ACH'), g: eg.debt },
        { key: 'tax', text: v.tax === 2 ? 'Overdue' : v.tax === 1 ? 'Late' : 'Current', g: eg.tax },
        { key: 'line', text: Math.round(v.line) + '%' + (v.alert === 2 ? ' workout' : v.alert === 1 ? ' notice' : ''), g: eg.line }
      ];

      const worst = Math.max.apply(null, cells.map(c => c.g));
      if (worst === 1) watchCount += 1;
      if (worst === 2) actCount += 1;

      return {
        id: b.id,
        name: b.name,
        bank: b.bank,
        health: st.word[worst],
        badgeStyle: st.badge[worst],
        rowBg: st.rowBg[worst],
        cells: cells.map(c => ({ text: c.text, style: st.cell[c.g] })),
        pick: () => this.setState({ selected: b.id })
      };
    });

    // Detail Panel
    const selBorrower = bankBs.find(b => b.id === s.selected) || bankBs.find(b => b.id === 'brightwater') || bankBs[0];
    const sv = selBorrower.at(week);
    const selKeys = ['cov', 'cash', 'rev', 'ap', 'debt', 'ar', 'conc', 'line', 'books'];
    const selWorst = Math.max.apply(null, selKeys.map(k => this.gradeBank(k, sv)));
    const phrases = { cov: 'debt coverage ' + sv.cov.toFixed(2) + 'x', cash: 'cash covers ' + sv.cash.toFixed(1) + ' months of payments', rev: 'revenue ' + Math.round(sv.rev) + '% vs last year', ap: Math.round(sv.ap) + '% of bills over 60 days', debt: sv.debt === 2 ? 'daily payments to an outside lender' : 'a new lender in the books', ar: 'receivables current ' + Math.round(sv.arPct) + '%', conc: 'largest payer ' + Math.round(sv.conc) + '%', line: sv.alert === 2 ? 'joint workout under way' : 'line nearly fully used or notice sent', books: 'books last updated ' + Math.round(sv.books) + ' days ago' };
    const selFlags = selKeys.filter(k => this.gradeBank(k, sv) > 0).map(k => phrases[k]);
    const detail = {
      name: selBorrower.name,
      industry: selBorrower.industry + ' \u2014 ' + selBorrower.bank,
      health: st.word[selWorst],
      badgeStyle: st.badge[selWorst],
      summary: selFlags.length === 0 ? 'Every indicator is within normal range this week.' : 'Needs attention: ' + selFlags.join('; ') + '.',
      items: [
        { label: 'Debt coverage', text: sv.cov.toFixed(2) + 'x', source: 'Borrower\u2019s books \u00b7 SBA loan needs 1.25x', boxStyle: st.box[this.gradeBank('cov', sv)] },
        { label: 'Available on the line', text: ((k) => (k < 0 ? '\u2212$' : '$') + Math.abs(Math.round(k)) + 'K')((sv.ar - sv.inelig) * sv.adv - (selBorrower.limit * sv.line / 100)), source: 'eCapital borrowing base', boxStyle: '' },
        { label: 'Dilution', text: sv.dil.toFixed(1) + '%', source: 'eCapital \u00b7 watch at 3%, act at 5%', boxStyle: st.box[sv.dil > 5 ? 2 : sv.dil >= 3 ? 1 : 0] },
        { label: 'Cash covers', text: sv.cash.toFixed(1) + ' mo', source: 'Borrower\u2019s books', boxStyle: st.box[this.gradeBank('cash', sv)] },
        { label: 'Receivables current', text: Math.round(sv.arPct) + '%', source: 'eCapital', boxStyle: st.box[this.gradeBank('ar', sv)] },
        { label: 'New debt', text: sv.debt === 2 ? 'Daily debits' : sv.debt === 1 ? '1 new lender' : 'None', source: 'Borrower\u2019s books', boxStyle: st.box[this.gradeBank('debt', sv)] }
      ]
    };

    // Borrower Profile
    const fmtK = (k) => { const n = Math.round(k), sign = n < 0 ? '\u2212' : ''; const a = Math.abs(n); return sign + (a >= 1000 ? '$' + (a / 1000).toFixed(2) + 'M' : '$' + a + 'K'); };
    const bProf = bs.find(b => b.id === (s.selectedBorrower || 'brightwater')) || bs[0];
    const bv = bProf.at(week);
    const bDrawn = Math.round(bProf.limit * bv.line / 100);
    const bBase = Math.round((bv.ar - bv.inelig) * bv.adv);
    const bAvail = bBase - bDrawn;
    const borrowerData = {
      limit: fmtK(bProf.limit),
      drawn: fmtK(bDrawn),
      avail: fmtK(bAvail),
      linePct: Math.round(bv.line),
      termBal: fmtK(bProf.termLoanOriginal - (week * 4.2)),
      termPmt: bProf.monthlyPmt,
      dscr: bv.cov.toFixed(2),
      sweptAmount: fmtK(Math.max(0, (bv.ar * 7 / bv.dso) * (1 - bv.adv) - (bv.ar * 7 / bv.dso) * 0.0175))
    };
    const bCollect30 = bv.ar * Math.min(1, 30 / bv.dso);
    const bBack = bCollect30 * (1 - bv.adv);
    const bCashK = bv.cash * bProf.monthlyPmt;
    const forecastText = 'Your customers pay in about ' + Math.round(bv.dso) + ' days on average, so about $' + Math.round(bCollect30) + 'K of payments are due over the next 30 days. After modeled advance repayment, about $' + Math.round(bBack) + 'K comes back to you. Cash in your accounts covers about ' + bv.cash.toFixed(1) + ' months of your $' + bProf.monthlyPmt.toFixed(1) + 'K SBA payment' + (bv.cash < 1 ? ', which is below one month; this may warrant a discussion with your lenders.' : bv.cash < 3 ? ', which is tight.' : '.');

    // Events
    const events = [];
    for (let w = 1; w <= week; w++) {
      if (w === 3) events.push({ w: 3, name: 'Brightwater Imaging', word: 'Watch', badgeStyle: st.badge[1], text: 'Insurer payments slowing; receivables current below 80%', when: this.weekLabelFor(w) });
      if (w === 7) events.push({ w: 7, name: 'Brightwater Imaging', word: 'Act now', badgeStyle: st.badge[2], text: 'Daily payments to an outside lender appeared in the borrower\u2019s books', when: this.weekLabelFor(w) });
      if (w === 8) events.push({ w: 8, name: 'Brightwater Imaging', word: 'Watch', badgeStyle: st.badge[1], text: 'scenario suggests an advance-rate notice for lender review', when: this.weekLabelFor(w) });
      if (w === 9) events.push({ w: 9, name: 'Brightwater Imaging', word: 'Act now', badgeStyle: st.badge[2], text: 'Insurance denials pushed dilution to 5.6%; an insurer paid the practice directly', when: this.weekLabelFor(w) });
      if (w === 9) events.push({ w: 9, name: 'Northgate Supply', word: 'Watch', badgeStyle: st.badge[1], text: 'Another lender filed a claim that may cover receivables; advances paused for review', when: this.weekLabelFor(w) });
      if (w === 10) events.push({ w: 10, name: 'Brightwater Imaging', word: 'Act now', badgeStyle: st.badge[2], text: 'joint workout begins with the bank and eCapital', when: this.weekLabelFor(w) });
    }
    for (let k = events.length - 1; k >= 0; k--) { if (bankOf(events[k].name) !== viewBank) events.splice(k, 1); }
    events.sort((a, b) => b.w - a.w);

    const fraudOpen = (bs[3].at(week).mis ? 1 : 0) + (bs[4].at(week).lien ? 1 : 0) + (bs[1].at(week).dup ? 1 : 0) + (bs[3].at(week).dil > 4 ? 1 : 0);
    const stp = Math.round(this.ramp(week, 0, 12, 81, 87) - fraudOpen * 1.5);
    const steps = [
      { n: 1, title: 'Ingest', how: 'Invoices sync from the borrower\u2019s accounting system; no uploads', value: String(190 + week * 3), metric: 'invoices synced' },
      { n: 2, title: 'Verify', how: 'Customer confirms in one click; payment history and credit checks run automatically', value: Math.round(this.ramp(week, 0, 12, 88, 93)) + '%', metric: 'verified automatically' },
      { n: 3, title: 'Check', how: 'Eligibility and seven fraud checks run before funding; exceptions go to a person', value: String(fraudOpen), metric: 'held for review' },
      { n: 4, title: 'Fund', how: 'Borrowing base updates daily; clean invoices fund without review', value: stp + '%', metric: 'funded straight through' },
      { n: 5, title: 'Collect and match', how: 'Payments match to invoices; the rest returns to the borrower\u2019s bank account', value: (96 - (bs[3].at(week).mis ? 1 : 0)) + '%', metric: 'payments auto-matched' },
    ];

    const themes = {
      bank: { navBg: '#15222B', subColor: '#A9B8BF' },
      ecap: { navBg: '#0F2A30', subColor: '#A6C1C4' },
      borrower: { navBg: '#1C2730', subColor: '#A9B8BF' }
    };

    // Dynamic Clickable Sidebars
    const bTab = s.bankSubTab;
    const eTab = s.ecapSubTab;
    const brTab = s.borrowerSubTab;

    const sidebars = {
      bank: {
        title: 'Bank Risk Portal',
        sub: viewBank,
        links: [
          { label: 'Borrower health · Phase 1', onClick: () => this.setState({ bankSubTab: 'health' }), style: bTab === 'health' ? 'background: #22343F; color: #FFF' : 'color: #DDE5E8; background: transparent' },
          { label: 'Loan-file review · Phase 2+', onClick: () => this.setState({ bankSubTab: 'radar' }), style: bTab === 'radar' ? 'background: #22343F; color: #FFF' : 'color: #DDE5E8; background: transparent' },
          { label: 'Joint workout room · Phase 1', onClick: () => this.setState({ bankSubTab: 'workout' }), style: bTab === 'workout' ? 'background: #22343F; color: #FFF' : 'color: #DDE5E8; background: transparent' },
          { label: 'Servicing evidence · Phase 2+', onClick: () => this.setState({ bankSubTab: 'sop' }), style: bTab === 'sop' ? 'background: #22343F; color: #FFF' : 'color: #DDE5E8; background: transparent' },
        ]
      },
      ecap: {
        title: 'eCapital Operations',
        sub: 'Risk desk \u00b7 all partner banks (internal)',
        links: [
          { label: 'Collateral and borrowing base', onClick: () => this.setState({ ecapSubTab: 'collateral' }), style: eTab === 'collateral' ? 'background: #1C3E45; color: #FFF' : 'color: #D7E6E8; background: transparent' },
          { label: 'Verification and fraud checks', onClick: () => this.setState({ ecapSubTab: 'verify' }), style: eTab === 'verify' ? 'background: #1C3E45; color: #FFF' : 'color: #D7E6E8; background: transparent' },
          { label: 'Collections and sweep', onClick: () => this.setState({ ecapSubTab: 'sweeps' }), style: eTab === 'sweeps' ? 'background: #1C3E45; color: #FFF' : 'color: #D7E6E8; background: transparent' },
          { label: 'Pilot gates', onClick: () => this.setState({ ecapSubTab: 'gates' }), style: eTab === 'gates' ? 'background: #1C3E45; color: #FFF' : 'color: #D7E6E8; background: transparent' },
        ]
      },
      borrower: {
        title: 'Borrower Unified Hub',
        sub: 'Commercial Client View',
        links: [
          { label: 'Cash and loans', onClick: () => this.setState({ borrowerSubTab: 'dash' }), style: brTab === 'dash' ? 'background: #2C3B47; color: #FFF' : 'color: #DDE5E8; background: transparent' },
          { label: 'Request an advance', onClick: () => this.setState({ borrowerSubTab: 'advance' }), style: brTab === 'advance' ? 'background: #2C3B47; color: #FFF' : 'color: #DDE5E8; background: transparent' },
          { label: 'Upload once, both lenders', onClick: () => this.setState({ borrowerSubTab: 'vault' }), style: brTab === 'vault' ? 'background: #2C3B47; color: #FFF' : 'color: #DDE5E8; background: transparent' },
          { label: 'Sweeps to your account', onClick: () => this.setState({ borrowerSubTab: 'sweeps' }), style: brTab === 'sweeps' ? 'background: #2C3B47; color: #FFF' : 'color: #DDE5E8; background: transparent' },
        ]
      }
    };

    const ngLien = bs[4].at(week).lien;
    const bwDebt = bs[3].at(week).debt;

    // Radar Rows
    const radarAuditRows = [
      { name: 'Delgado Foods', industry: 'Wholesale Foods', bg: '#FFFFFF', lienText: 'None', lienStyle: 'color: #0E4F45' },
      { name: 'Harbor Precision Mfg.', industry: 'Manufacturing', bg: '#FFFFFF', lienText: 'None', lienStyle: 'color: #0E4F45' },
      { name: 'Ridgeview Dental Group', industry: 'Healthcare', bg: '#FFFFFF', lienText: 'None', lienStyle: 'color: #0E4F45' },
      { name: 'Brightwater Imaging', industry: 'Outpatient Imaging', bg: bwDebt > 0 ? '#FFF7F6' : '#FFFFFF', lienText: bwDebt === 2 ? 'Daily debits to another lender' : 'None', lienStyle: bwDebt > 0 ? 'color: #8A1C1C' : 'color: #0E4F45' },
      { name: 'Northgate Building Supply', industry: 'Building Materials', bg: ngLien ? '#FFF7F6' : '#FFFFFF', lienText: ngLien ? 'New lender claim filed' : 'None', lienStyle: ngLien ? 'color: #8A1C1C' : 'color: #0E4F45' },
    ];

    for (let k = radarAuditRows.length - 1; k >= 0; k--) { if (bankOf(radarAuditRows[k].name) !== viewBank) radarAuditRows.splice(k, 1); }
    const radarDefectCount = (bwDebt > 0 ? 1 : 0) + (ngLien ? 1 : 0);
    const gateRefs = Math.min(46, 18 + Math.round(week * 2.2));

    // explicit fraud checks
    const bwNow = bs[3].at(week), ngNow = bs[4].at(week), hbNow = bs[1].at(week);
    let dupWeek = null; for (let x = week; x >= 0; x--) { if (bs[1].at(x).dup) { dupWeek = this.weekLabelFor(x); break; } }
    const fraudChecks = [
      { name: 'Duplicate or altered invoice', catches: 'The same invoice submitted twice, or an amount that differs from the books', how: 'Each invoice matched to the accounting record and to prior submissions', count: hbNow.dup ? 1 : 0, latest: dupWeek ? 'Harbor Precision: duplicate number, ' + dupWeek + '; cleared as a resend' : 'None' },
      { name: 'Unconfirmed customer', catches: 'Invoices to customers who never ordered or received the goods', how: 'One-click confirmation sent to the customer; unconfirmed invoices aren\u2019t funded', count: Math.round((100 - bwNow.ver) * 0.6), latest: bwNow.ver < 94 ? 'Brightwater: verification down to ' + Math.round(bwNow.ver) + '%' : 'Normal confirmation rates' },
      { name: 'New or related-party customer', catches: 'Fake customers, or customers sharing an owner or address with the borrower', how: 'Credit check plus ownership and address match on every new customer', count: 0, latest: 'No matches' },
      { name: 'Payment outside collection account', catches: 'A customer paying the borrower directly, so the advance isn\u2019t repaid', how: 'Expected payments tracked against due dates; a missing payment triggers a check with the customer', count: bwNow.mis ? 1 : 0, latest: bwNow.mis ? 'Brightwater: $14K insurer payment went to the practice; repaid and payer re-notified' : 'None' },
      { name: 'Another lender\u2019s claim', catches: 'The same receivables pledged to a second lender', how: 'Lien records re-checked monthly and whenever new debt appears in the books', count: ngNow.lien ? 1 : 0, latest: ngNow.lien ? 'Northgate: new lender filed a claim; advances paused pending review' : 'None' },
      { name: 'Unusual invoice pattern', catches: 'Month-end spikes, round amounts, invoices dated before service or delivery', how: 'Pattern rules compare each borrower with its own history', count: 0, latest: 'None' },
      { name: 'Insurance denial spike', catches: 'Healthcare claims that won\u2019t be paid', how: 'Denial rate tracked by payer against the practice\u2019s history', count: bwNow.dil > 4 ? 1 : 0, latest: bwNow.dil > 4 ? 'Brightwater: denials up; ineligible claims removed from the base' : 'None' }
    ].map(c => ({ name: c.name, catches: c.catches, how: c.how, latest: c.latest, count: String(c.count), countStyle: c.count > 0 ? 'color: #8A1C1C; font-weight: 700' : 'color: #0E4F45', bg: c.count > 0 ? '#FFF7F6' : '#FFFFFF' }));

    // weekly collections and sweep, from the same borrower data
    let colWk = 0, payWk = 0, feeWk = 0;
    bs.forEach(b => { const v = b.at(week); const c = v.ar * 7 / v.dso; colWk += c; payWk += c * v.adv; feeWk += c * 0.0175; });
    const kfmt = (x) => '$' + Math.round(x) + 'K';
    const sweep = { collected: kfmt(colWk), paydown: kfmt(payWk), excess: kfmt(colWk - payWk - feeWk) };

    // workout room follows the timeline
    const workoutActive = bwNow.alert === 2 && bankOf('Brightwater') === viewBank;
    const workoutHint = bankOf('Brightwater') !== viewBank ? 'No borrower at this bank has crossed the workout thresholds.' : (bwNow.alert === 1 ? 'Brightwater Imaging received an advance-rate notice and is close to the workout threshold.' : 'Press Jump to the crisis to see the joint workout.');

    return {
      isBank: persona === 'bank',
      isEcap: persona === 'ecap',
      isBorrower: persona === 'borrower',

      // Bank Subtabs
      isBankHealth: persona === 'bank' && bTab === 'health',
      isBankRadar: persona === 'bank' && bTab === 'radar',
      isBankWorkout: persona === 'bank' && bTab === 'workout',
      isBankSop: persona === 'bank' && bTab === 'sop',

      // eCapital Subtabs
      isEcapCollateral: persona === 'ecap' && eTab === 'collateral',
      isEcapVerify: persona === 'ecap' && eTab === 'verify',
      isEcapSweeps: persona === 'ecap' && eTab === 'sweeps',
      isEcapGates: persona === 'ecap' && eTab === 'gates',

      // Borrower Subtabs
      isBorrowerDash: persona === 'borrower' && brTab === 'dash',
      isBorrowerAdvance: persona === 'borrower' && brTab === 'advance',
      isBorrowerVault: persona === 'borrower' && brTab === 'vault',
      isBorrowerSweeps: persona === 'borrower' && brTab === 'sweeps',

      personaBtnBank: persona === 'bank' ? 'background: #F2B66D; color: #15222B' : 'background: #173238; color: #C9D5DA',
      personaBtnEcap: persona === 'ecap' ? 'background: #F2B66D; color: #15222B' : 'background: #173238; color: #C9D5DA',
      personaBtnBorrower: persona === 'borrower' ? 'background: #F2B66D; color: #15222B' : 'background: #173238; color: #C9D5DA',
      theme: themes[persona],
      sidebar: sidebars[persona],

      switchBank: () => this.setState({ persona: 'bank' }),
      switchEcap: () => this.setState({ persona: 'ecap' }),
      switchBorrower: () => this.setState({ persona: 'borrower' }),
      switchBorrowerAdvance: () => this.setState({ borrowerSubTab: 'advance' }),

      week: week,
      weekLabel: this.weekLabelFor(week),
      weekCount: 'Week ' + (week + 1) + ' of 13',
      playLabel: s.playing ? 'Pause' : (week >= 12 ? 'Replay' : 'Play'),
      onPlay: () => this.togglePlay(),
      onJump: () => { if (this.timer) clearInterval(this.timer); this.timer = null; this.setState({ week: 10, playing: false }); },
      onReset: () => {
        if (this.timer) clearInterval(this.timer);
        this.timer = null;
        this.setState({ week: 0, playing: false });
      },
      onSlide: (e) => this.setState({ week: Number(e.target.value) }),
      onSelectBorrower: (e) => this.setState({ selectedBorrower: e.target.value }),
      selectedBorrowerId: s.selectedBorrower || 'brightwater',

      countGreen: bankCounts[0],
      countAmber: bankCounts[1],
      countRed: bankCounts[2],
      totalDrawn: '$' + (bankDrawn / 1000).toFixed(2) + 'M',
      viewBank: viewBank,
      bankCount: String(bankBs.length),
      bankScope: bankBs.length === 1 ? '1 borrower' : bankBs.length + ' borrowers',
      startHint: bankOf('Brightwater') === viewBank ? 'Start here: press Play and watch Brightwater Imaging, or jump to the crisis. Thresholds are examples a credit committee would set.' : 'Press Play to run 13 weeks. Thresholds are examples a credit committee would set.',
      pickFV: () => this.setState({ viewBank: 'First Valley Community Bank' }),
      pickLS: () => this.setState({ viewBank: 'Lakeshore Bank' }),
      tabFV: viewBank === 'First Valley Community Bank' ? 'background: #0B5F6B; color: #FFFFFF; border: 1px solid #0B5F6B' : 'background: #FFFFFF; color: #15222B; border: 1px solid #9DB0B8',
      tabLS: viewBank === 'Lakeshore Bank' ? 'background: #0B5F6B; color: #FFFFFF; border: 1px solid #0B5F6B' : 'background: #FFFFFF; color: #15222B; border: 1px solid #9DB0B8',
      bankRows: bankRows,
      ecapRows: ecapRows,
      detail: detail,
      borrowerProfile: bProf,
      borrowerData: borrowerData,
      kpi: {
        drawn: '$' + (drawnTotal / 1000).toFixed(2) + 'M',
        committed: 'of $' + (committed / 1000).toFixed(2) + 'M approved',
        contrib: (4.2 - (bs[3].at(week).dil > 3 ? 0.6 : 0)).toFixed(1) + '%',
        stp: stp + '%',
        fraud: String(fraudOpen),
        fraudBox: fraudOpen > 0 ? 'background: #FDECEA; border: 1px solid #E8B4AE; color: #8A1C1C' : 'background: #FFFFFF; border: 1px solid #DCE2E4; color: #15222B'
      },
      steps: steps,
      events: events.slice(0, 5),
      noEvents: events.length === 0,

      fraudChecks: fraudChecks,
      sweep: sweep,
      forecast: forecastText,
      workoutActive: workoutActive,
      noWorkout: !workoutActive,
      workoutHint: workoutHint,
      workoutStartLabel: this.weekLabelFor(10),
      radarAuditRows: radarAuditRows,
      radarDefectCount: String(radarDefectCount),
      radarCureColor: radarDefectCount > 0 ? '#8A1C1C' : '#0E4F45',

      gateRefs: String(gateRefs),
      gateRefsStatus: gateRefs >= 40 ? '\u2713 Target Met (\u226540)' : 'On Track (Target 40)',
      gateRefsColor: gateRefs >= 40 ? '#0E4F45' : '#7A3E06'
    };
  }

  togglePlay() {
    const s = this.state;
    if (s.playing) {
      if (this.timer) clearInterval(this.timer);
      this.timer = null;
      this.setState({ playing: false });
      return;
    }
    const start = s.week >= 12 ? 0 : s.week;
    this.setState({ playing: true, week: start });
    if (this.timer) clearInterval(this.timer);
    this.timer = setInterval(() => {
      const w = this.state.week;
      if (w >= 12) {
        clearInterval(this.timer);
        this.timer = null;
        this.setState({ playing: false });
        return;
      }
      this.setState({ week: w + 1 });
    }, 2300);
  }
}
window.__startDC(Component);
</script>
